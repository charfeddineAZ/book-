# ========================================================================
#  🚀 Android CI – شامل ومتكامل لبناء APK
#  يقوم بتثبيت SDK، تحديث الأدوات، وتشخيص الأخطاء
# ========================================================================

name: 🚀 Android CI (Full Build & Diagnostics)

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ '**/*.md', '**/*.txt', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: 'مهام Gradle (اترك فارغاً للافتراضي)'
        required: false
        default: 'clean assembleDebug lintDebug testDebugUnitTest'
        type: string
      enable_debug_mode:
        description: 'تفعيل --debug (سجلات ضخمة)'
        required: false
        default: false
        type: boolean
      enable_build_scan:
        description: 'تفعيل --scan (تحليل متقدم)'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'تخطي الاختبارات (تشخيص سريع)'
        required: false
        default: false
        type: boolean
      fix_conflicts_automatically:
        description: 'محاولة إصلاح تعارضات build.gradle تلقائياً'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  checks: write
  pull-requests: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m
  JAVA_TOOL_OPTIONS: -Xmx4g
  # استخدام SDK المثبت مسبقاً في runner
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # سنضيف PATH لاحقاً في خطوة منفصلة

jobs:
  preflight-check:
    name: 🔎 فحص ما قبل البناء
    runs-on: ubuntu-latest
    outputs:
      conflict_detected: ${{ steps.detect-conflicts.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK PATH
        run: echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH" >> $GITHUB_ENV

      - name: 🚨 كشف التعارضات (وجود أكثر من ملف build.gradle في نفس المجلد)
        id: detect-conflicts
        run: |
          conflict=0
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | sort | uniq -d | while read dir; do
            echo "⚠️ تعارض في المجلد: $dir"
            conflict=1
          done
          echo "conflict=$conflict" >> $GITHUB_OUTPUT

      - name: 🔧 الإصلاح التلقائي للتعارضات
        if: inputs.fix_conflicts_automatically == true && steps.detect-conflicts.outputs.conflict == '1'
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | sort | uniq -d | while read dir; do
            echo "🔧 إصلاح التعارض في: $dir"
            if [ -f "$dir/build.gradle.kts" ] && [ -f "$dir/build.gradle" ]; then
              rm -v "$dir/build.gradle"
            fi
          done

  build:
    name: 🔨 بناء APK وتشخيص شامل
    runs-on: ubuntu-latest
    needs: preflight-check
    if: |
      !(needs.preflight-check.outputs.conflict_detected == '1' && 
        inputs.fix_conflicts_automatically != true)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ----- إعداد البيئة -----
      - name: Set up Android SDK PATH
        run: echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH" >> $GITHUB_ENV

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        id: setup_java

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      # ----- تثبيت وتحديث Android SDK -----
      - name: 🤖 Install/Update Android SDK components
        run: |
          echo "📦 قبول التراخيص..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          echo "📦 تحديث قائمة الحزم..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update

          echo "📦 تثبيت platform-tools..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

          echo "📦 تثبيت حزم إضافية (Extras) إن وجدت..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "extras;google;gcm" "extras;google;google_play_services" || true

          echo "✅ تم تثبيت جميع المكونات."

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ----- عرض معلومات البيئة -----
      - name: 🌍 Environment Details
        run: |
          echo "✅ OS: $(uname -a)"
          echo "✅ Java: $(java -version 2>&1 | head -1)"
          echo "✅ Gradle: $(./gradlew --version --no-daemon | grep Gradle)"
          echo "✅ ANDROID_HOME: $ANDROID_HOME"
          echo "✅ PATH: $PATH"
          echo "✅ حزم SDK المثبتة:"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | head -20

      # ----- تحديث Gradle Wrapper (اختياري) -----
      - name: 🔄 Update Gradle Wrapper (optional)
        run: |
          echo "🔄 تحديث Gradle Wrapper إلى أحدث إصدار..."
          ./gradlew wrapper --gradle-version=8.7 --distribution-type=all || echo "⚠️ فشل التحديث، استمرار باستخدام الإصدار الحالي"

      # ----- تحميل التبعيات (للتأكد من وجودها) -----
      - name: 📦 Download dependencies
        run: |
          echo "📦 تحميل التبعيات..."
          ./gradlew dependencies --no-daemon || echo "⚠️ فشل تحميل التبعيات، قد تكون هناك مشكلة في ملفات build.gradle"

      # ----- البناء الفعلي مع تشخيص كامل -----
      - name: 🏗️ Build APK with Full Diagnostics
        id: build_step
        shell: bash
        run: |
          TASKS="${{ inputs.gradle_tasks }}"
          if [ -z "$TASKS" ]; then
            TASKS="clean assembleDebug lintDebug testDebugUnitTest"
          fi
          if [ "${{ inputs.skip_tests }}" == "true" ]; then
            TASKS=$(echo $TASKS | sed 's/testDebugUnitTest//g' | sed 's/  */ /g' | xargs)
            echo "⏩ Skipping tests"
          fi

          FLAGS="--stacktrace --info --no-configuration-cache --no-build-cache"
          [ "${{ inputs.enable_debug_mode }}" == "true" ] && FLAGS="$FLAGS --debug"
          [ "${{ inputs.enable_build_scan }}" == "true" ] && FLAGS="$FLAGS --scan"

          echo "🚀 Running: ./gradlew $TASKS $FLAGS"
          echo "🕒 Start: $(date)"
          ./gradlew $TASKS $FLAGS --no-color 2>&1 | tee gradle_full_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "🕒 End: $(date)"
          exit $EXIT_CODE

      # ----- استخراج الأخطاء -----
      - name: 🧹 Extract All Errors
        if: always()
        run: |
          grep -A 5 -B 2 "^e: " gradle_full_output.log > kotlin_compiler_errors.log || echo "⚠️ No Kotlin errors"
          grep -A 3 -B 1 "^w: " gradle_full_output.log > kotlin_warnings.log || echo "⚠️ No warnings"
          grep -A 20 "Caused by:" gradle_full_output.log > critical_stacktraces.log || echo "⚠️ No exceptions"
          grep -A 10 "Lint found" gradle_full_output.log > lint_errors.log || echo "⚠️ No Lint errors"
          grep -E "^FAILURE|^What went wrong:|^BUILD FAILED" gradle_full_output.log > gradle_errors.log || echo "⚠️ No Gradle errors"

      # ----- ملخص مرئي -----
      - name: 📝 Job Summary
        if: always()
        run: |
          {
            echo "## 🧪 ملخص CI"
            echo ""
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| **الحالة** | ${{ job.status }} |"
            echo "| **المهام** | ${{ inputs.gradle_tasks || 'default' }} |"
            echo "| **Debug** | ${{ inputs.enable_debug_mode }} |"
            echo "| **Build Scan** | ${{ inputs.enable_build_scan }} |"
            echo "| **تخطي الاختبارات** | ${{ inputs.skip_tests }} |"
            echo "| **Java** | ${{ steps.setup_java.outputs.version }} |"
            echo "| **رمز الخروج** | ${{ steps.build_step.outputs.exit_code }} |"
            echo "| **تعارضات مُصلحة** | ${{ needs.preflight-check.outputs.conflict_detected }} |"
            echo ""
            echo "### 🔴 أخطاء المترجم (أول 10)"
            echo '```'
            head -10 kotlin_compiler_errors.log 2>/dev/null || echo "لا توجد"
            echo '```'
            echo ""
            echo "### 🔥 استثناءات (أول 10)"
            echo '```'
            head -10 critical_stacktraces.log 2>/dev/null || echo "لا توجد"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # ----- رفع الملفات -----
      - name: 📤 Upload All Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-full-build-${{ github.run_id }}
          path: |
            gradle_full_output.log
            kotlin_compiler_errors.log
            kotlin_warnings.log
            critical_stacktraces.log
            lint_errors.log
            gradle_errors.log
            app/build/reports/
            app/build/outputs/apk/
            app/build/test-results/
            **/build/reports/
            **/build/outputs/apk/
          retention-days: 14

      - name: 📱 Upload APK (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 🧹 Cleanup Daemon
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf ~/.gradle/daemon || true

      - name: 📢 Done
        if: always()
        run: echo "✅ انتهى التشغيل. راجع المرفقات والملخص."
