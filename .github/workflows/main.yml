# ========================================================================
#  🚀 Android CI – النسخة النهائية المستقرة
#  تم إصلاح أخطاء الصياغة والتعارضات
# ========================================================================

name: 🚀 Android CI (Ultimate Robust)

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ '**/*.md', '**/*.txt', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: 'مهام Gradle (اترك فارغاً للافتراضي)'
        required: false
        default: 'clean assembleDebug lintDebug testDebugUnitTest'
        type: string
      enable_debug_mode:
        description: 'تفعيل --debug (سجلات ضخمة)'
        required: false
        default: false
        type: boolean
      enable_build_scan:
        description: 'تفعيل --scan (تحليل متقدم)'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'تخطي الاختبارات (تشخيص سريع)'
        required: false
        default: false
        type: boolean
      fix_conflicts_automatically:
        description: 'محاولة إصلاح تعارضات build.gradle تلقائياً'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  checks: write
  pull-requests: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m
  JAVA_TOOL_OPTIONS: -Xmx4g
  # استخدام SDK المثبت مسبقاً في runner
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  # ملاحظة: تم حذف PATH من هنا، سيتم إضافته في خطوة منفصلة

jobs:
  preflight-check:
    name: 🔎 فحص ما قبل البناء
    runs-on: ubuntu-latest
    outputs:
      build_files_count: ${{ steps.count-build-files.outputs.count }}
      build_file_to_keep: ${{ steps.choose-build-file.outputs.file }}
      conflict_detected: ${{ steps.detect-conflicts.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4

      # إعداد PATH لـ Android SDK في هذه المهمة أيضاً
      - name: Set up Android SDK PATH
        run: |
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH" >> $GITHUB_ENV

      - name: 📊 فحص ملفات build.gradle
        id: count-build-files
        run: |
          echo "🔍 البحث عن ملفات build.gradle في المشروع..."
          count=$(find . -name "build.gradle" -o -name "build.gradle.kts" | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "✅ تم العثور على $count ملف(ملفات) بناء."

      - name: 🚨 كشف التعارضات (وجود أكثر من ملف في نفس المجلد)
        id: detect-conflicts
        run: |
          conflict=0
          # البحث عن مجلدات تحتوي على كلا الملفين
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | sort | uniq -d | while read dir; do
            echo "⚠️ تعارض في المجلد: $dir"
            conflict=1
          done
          echo "conflict=$conflict" >> $GITHUB_OUTPUT
          if [ $conflict -eq 1 ]; then
            echo "❌ تم اكتشاف تعارض! سيتم محاولة الإصلاح التلقائي."
          else
            echo "✅ لا توجد تعارضات."
          fi

      - name: 🔧 الإصلاح التلقائي للتعارضات (اختياري)
        id: choose-build-file
        if: inputs.fix_conflicts_automatically == true && steps.detect-conflicts.outputs.conflict == '1'
        run: |
          # استراتيجية الإصلاح: الاحتفاظ بـ build.gradle.kts إذا وجد، وإلا الاحتفاظ بـ build.gradle
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | sort | uniq -d | while read dir; do
            echo "🔧 إصلاح التعارض في: $dir"
            if [ -f "$dir/build.gradle.kts" ] && [ -f "$dir/build.gradle" ]; then
              echo "   ✅ الاحتفاظ بـ build.gradle.kts وحذف build.gradle"
              rm -v "$dir/build.gradle"
            elif [ -f "$dir/build.gradle" ] && [ -f "$dir/build.gradle.kts" ]; then
              echo "   ✅ الاحتفاظ بـ build.gradle.kts وحذف build.gradle"
              rm -v "$dir/build.gradle"
            fi
          done
          echo "file=build.gradle.kts" >> $GITHUB_OUTPUT

      - name: 📝 تقرير حالة الملفات بعد الإصلاح
        run: |
          echo "📁 الملفات المتبقية بعد الفحص:"
          find . -name "build.gradle*" -not -path "./.gradle/*" | sort

  build:
    name: 🔍 تشخيص كامل
    runs-on: ubuntu-latest
    needs: preflight-check
    # إذا كان هناك تعارض ولم يتم الإصلاح، نوقف البناء لتجنب الفشل المبكر
    if: |
      !(needs.preflight-check.outputs.conflict_detected == '1' && 
        inputs.fix_conflicts_automatically != true)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # إعداد PATH لـ Android SDK
      - name: Set up Android SDK PATH
        run: |
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH" >> $GITHUB_ENV

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        id: setup_java

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: 🤖 Verify Android SDK
        run: |
          echo "✅ مسار Android SDK: $ANDROID_HOME"
          ls -la $ANDROID_HOME || echo "⚠️ SDK غير موجود!"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | head -10 || echo "⚠️ sdkmanager غير متاح"

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 🌍 Environment Details
        run: |
          echo "✅ OS: $(uname -a)"
          echo "✅ Java: $(java -version 2>&1 | head -1)"
          echo "✅ Gradle: $(./gradlew --version --no-daemon | grep Gradle)"
          echo "✅ ANDROID_HOME: $ANDROID_HOME"
          echo "✅ PATH: $PATH"

      - name: 📂 Validate build files
        run: |
          echo "📁 ملفات build.gradle الموجودة:"
          find . -name "build.gradle*" -not -path "./.gradle/*" | while read f; do
            echo "   $f"
          done

      - name: 🏗️ Build with Maximum Verbosity
        id: build_step
        shell: bash
        run: |
          TASKS="${{ inputs.gradle_tasks }}"
          if [ -z "$TASKS" ]; then
            TASKS="clean assembleDebug lintDebug testDebugUnitTest"
          fi
          if [ "${{ inputs.skip_tests }}" == "true" ]; then
            TASKS=$(echo $TASKS | sed 's/testDebugUnitTest//g' | sed 's/  */ /g' | xargs)
            echo "⏩ Skipping tests"
          fi

          FLAGS="--stacktrace --info --no-configuration-cache --no-build-cache"
          [ "${{ inputs.enable_debug_mode }}" == "true" ] && FLAGS="$FLAGS --debug"
          [ "${{ inputs.enable_build_scan }}" == "true" ] && FLAGS="$FLAGS --scan"

          echo "🚀 Running: ./gradlew $TASKS $FLAGS"
          echo "🕒 Start: $(date)"
          ./gradlew $TASKS $FLAGS --no-color 2>&1 | tee gradle_full_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "🕒 End: $(date)"
          exit $EXIT_CODE

      - name: 🧹 Extract All Errors
        if: always()
        run: |
          grep -A 5 -B 2 "^e: " gradle_full_output.log > kotlin_compiler_errors.log || echo "⚠️ No Kotlin errors"
          grep -A 3 -B 1 "^w: " gradle_full_output.log > kotlin_warnings.log || echo "⚠️ No warnings"
          grep -A 20 "Caused by:" gradle_full_output.log > critical_stacktraces.log || echo "⚠️ No exceptions"
          grep -A 10 "Lint found" gradle_full_output.log > lint_errors.log || echo "⚠️ No Lint errors"
          grep -E "^FAILURE|^What went wrong:|^BUILD FAILED" gradle_full_output.log > gradle_errors.log || echo "⚠️ No Gradle errors"

      - name: 📝 Job Summary
        if: always()
        run: |
          {
            echo "## 🧪 ملخص CI"
            echo ""
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| **الحالة** | ${{ job.status }} |"
            echo "| **المهام** | ${{ inputs.gradle_tasks || 'default' }} |"
            echo "| **Debug** | ${{ inputs.enable_debug_mode }} |"
            echo "| **Build Scan** | ${{ inputs.enable_build_scan }} |"
            echo "| **تخطي الاختبارات** | ${{ inputs.skip_tests }} |"
            echo "| **Java** | ${{ steps.setup_java.outputs.version }} |"
            echo "| **رمز الخروج** | ${{ steps.build_step.outputs.exit_code }} |"
            echo "| **تعارضات مُصلحة** | ${{ needs.preflight-check.outputs.conflict_detected }} |"
            echo ""
            echo "### 🔴 أخطاء المترجم (أول 10)"
            echo '```'
            head -10 kotlin_compiler_errors.log 2>/dev/null || echo "لا توجد"
            echo '```'
            echo ""
            echo "### 🔥 استثناءات (أول 10)"
            echo '```'
            head -10 critical_stacktraces.log 2>/dev/null || echo "لا توجد"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-logs-${{ github.run_id }}
          path: |
            gradle_full_output.log
            kotlin_compiler_errors.log
            kotlin_warnings.log
            critical_stacktraces.log
            lint_errors.log
            gradle_errors.log
            app/build/reports/
            app/build/outputs/apk/
            app/build/test-results/
            **/build/reports/
          retention-days: 14

      - name: 📱 Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 🧹 Cleanup Daemon
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf ~/.gradle/daemon || true

      - name: 📢 Done
        if: always()
        run: echo "✅ انتهى التشغيل. راجع المرفقات والملخص."
