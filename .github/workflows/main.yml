# ========================================================================
#  🚀 Android CI – تشخيص متقدم لمشاكل AGP
# ========================================================================

name: 🚀 Android CI (AGP Diagnostic)

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ '**/*.md', '**/*.txt', 'docs/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: 'مهام Gradle (اترك فارغاً للافتراضي)'
        required: false
        default: 'clean assembleDebug lintDebug testDebugUnitTest'
        type: string
      enable_debug_mode:
        description: 'تفعيل --debug (سجلات ضخمة)'
        required: false
        default: false
        type: boolean
      enable_build_scan:
        description: 'تفعيل --scan (تحليل متقدم)'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'تخطي الاختبارات (تشخيص سريع)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  checks: write
  pull-requests: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m
  JAVA_TOOL_OPTIONS: -Xmx4g
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  preflight-check:
    name: 🔎 فحص ما قبل البناء
    runs-on: ubuntu-latest
    outputs:
      conflict_detected: ${{ steps.detect-conflicts.outputs.conflict }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK PATH
        run: echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH" >> $GITHUB_ENV

      - name: 🚨 كشف التعارضات
        id: detect-conflicts
        run: |
          conflict=0
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | sort | uniq -d | while read dir; do
            echo "⚠️ تعارض في المجلد: $dir"
            conflict=1
          done
          echo "conflict=$conflict" >> $GITHUB_OUTPUT

      - name: 🔧 إصلاح التعارضات (إن وجدت)
        if: inputs.fix_conflicts_automatically == true && steps.detect-conflicts.outputs.conflict == '1'
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -printf "%h\n" | sort | uniq -d | while read dir; do
            if [ -f "$dir/build.gradle.kts" ] && [ -f "$dir/build.gradle" ]; then
              rm -v "$dir/build.gradle"
            fi
          done

  build:
    name: 🔨 تشخيص AGP وبناء APK
    runs-on: ubuntu-latest
    needs: preflight-check
    if: |
      !(needs.preflight-check.outputs.conflict_detected == '1' && 
        inputs.fix_conflicts_automatically != true)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Android SDK PATH
        run: echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools:$PATH" >> $GITHUB_ENV

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
        id: setup_java

      - name: 🐘 Setup Gradle (محدث)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-cleanup: true   # تم استبدال gradle-home-cache-cleanup

      - name: 🤖 Install/Update Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0"

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ----- طباعة محتويات ملفات البناء (لتشخيص AGP) -----
      - name: 📄 Print build.gradle files content
        run: |
          echo "========== build.gradle (project) =========="
          cat build.gradle 2>/dev/null || echo "⚠️ لا يوجد build.gradle في الجذر"
          echo ""
          echo "========== build.gradle.kts (project) =========="
          cat build.gradle.kts 2>/dev/null || echo "⚠️ لا يوجد build.gradle.kts في الجذر"
          echo ""
          echo "========== app/build.gradle =========="
          cat app/build.gradle 2>/dev/null || echo "⚠️ لا يوجد app/build.gradle"
          echo ""
          echo "========== app/build.gradle.kts =========="
          cat app/build.gradle.kts 2>/dev/null || echo "⚠️ لا يوجد app/build.gradle.kts"
          echo ""
          echo "========== settings.gradle =========="
          cat settings.gradle 2>/dev/null || cat settings.gradle.kts 2>/dev/null || echo "⚠️ لا يوجد settings.gradle"

      - name: 🌍 Environment Details
        run: |
          echo "✅ OS: $(uname -a)"
          echo "✅ Java: $(java -version 2>&1 | head -1)"
          echo "✅ Gradle Wrapper version: $(./gradlew --version --no-daemon | grep Gradle)"
          echo "✅ ANDROID_HOME: $ANDROID_HOME"

      # ----- محاولة تشغيل مهام تشخيصية قبل البناء -----
      - name: 🔍 Diagnose Gradle tasks
        id: diagnose
        continue-on-error: true
        run: |
          echo "📋 عرض المهام المتاحة:"
          ./gradlew tasks --no-daemon --stacktrace || echo "⚠️ فشل في عرض المهام"
          echo ""
          echo "📋 فحص dependencies:"
          ./gradlew dependencies --no-daemon --stacktrace || echo "⚠️ فشل في عرض dependencies"
          echo ""
          echo "📋 فحص build --dry-run:"
          ./gradlew build --dry-run --no-daemon --stacktrace || echo "⚠️ فشل في تنفيذ dry-run"

      - name: 🏗️ Build APK with Full Diagnostics
        id: build_step
        shell: bash
        run: |
          TASKS="${{ inputs.gradle_tasks }}"
          if [ -z "$TASKS" ]; then
            TASKS="clean assembleDebug lintDebug testDebugUnitTest"
          fi
          if [ "${{ inputs.skip_tests }}" == "true" ]; then
            TASKS=$(echo $TASKS | sed 's/testDebugUnitTest//g' | sed 's/  */ /g' | xargs)
          fi

          FLAGS="--stacktrace --info --no-configuration-cache --no-build-cache"
          [ "${{ inputs.enable_debug_mode }}" == "true" ] && FLAGS="$FLAGS --debug"
          [ "${{ inputs.enable_build_scan }}" == "true" ] && FLAGS="$FLAGS --scan"

          echo "🚀 Running: ./gradlew $TASKS $FLAGS"
          echo "🕒 Start: $(date)"
          ./gradlew $TASKS $FLAGS --no-color 2>&1 | tee gradle_full_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "🕒 End: $(date)"
          exit $EXIT_CODE

      - name: 🧹 Extract All Errors
        if: always()
        run: |
          grep -A 10 -B 5 "PluginApplicationException" gradle_full_output.log > agp_errors.log || echo "⚠️ No AGP errors"
          grep -A 5 -B 2 "^e: " gradle_full_output.log > kotlin_compiler_errors.log || echo "⚠️ No Kotlin errors"
          grep -A 20 "Caused by:" gradle_full_output.log > critical_stacktraces.log || echo "⚠️ No exceptions"
          grep -E "^FAILURE|^What went wrong:|^BUILD FAILED" gradle_full_output.log > gradle_errors.log || echo "⚠️ No Gradle errors"

      - name: 📝 Job Summary
        if: always()
        run: |
          {
            echo "## 🧪 ملخص CI"
            echo ""
            echo "| الخاصية | القيمة |"
            echo "|---------|--------|"
            echo "| **الحالة** | ${{ job.status }} |"
            echo "| **المهام** | ${{ inputs.gradle_tasks || 'default' }} |"
            echo "| **Debug** | ${{ inputs.enable_debug_mode }} |"
            echo "| **Build Scan** | ${{ inputs.enable_build_scan }} |"
            echo "| **Java** | ${{ steps.setup_java.outputs.version }} |"
            echo "| **رمز الخروج** | ${{ steps.build_step.outputs.exit_code }} |"
            echo ""
            echo "### 🔴 أخطاء AGP (أول 15)"
            echo '```'
            head -15 agp_errors.log 2>/dev/null || echo "لا توجد"
            echo '```'
            echo ""
            echo "### 🔥 استثناءات (أول 15)"
            echo '```'
            head -15 critical_stacktraces.log 2>/dev/null || echo "لا توجد"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-logs-${{ github.run_id }}
          path: |
            gradle_full_output.log
            agp_errors.log
            kotlin_compiler_errors.log
            critical_stacktraces.log
            gradle_errors.log
            app/build/reports/
            app/build/outputs/apk/
            app/build/test-results/
            **/build/reports/
          retention-days: 14

      - name: 📱 Upload APK (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 🧹 Cleanup
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf ~/.gradle/daemon || true

      - name: 📢 Done
        if: always()
        run: echo "✅ انتهى التشغيل."
